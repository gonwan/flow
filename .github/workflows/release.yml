name: Release

on: workflow_dispatch

jobs:
  build-win-x64:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Get Version
        id: get-version
        run: node -p -e "'VERSION='+require('./apps/electron/package.json').version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build & Package Windows
        run: pnpm --filter @flow/electron build
      - name: Upload Release Artifact - Windows
        uses: softprops/action-gh-release@v3
        #if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION: ${{ steps.get-version.outputs.VERSION }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            release/flowoss-app-v${{ env.APP_VERSION }}-windows-x64.zip

  build-mac-x64:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Get Version
        id: get-version
        run: node -p -e "'VERSION='+require('./apps/electron/package.json').version" >> "$GITHUB_OUTPUT"
      - name: Build & Package MacOS
        run: pnpm --filter @flow/electron build
      - name: Upload Release Artifact - MacOS
        uses: softprops/action-gh-release@v3
        #if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION: ${{ steps.get-version.outputs.VERSION }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            release/flowoss-app-v${{ env.APP_VERSION }}-macos-x64.dmg

  build-linux-x64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Get Version
        id: get-version
        run: node -p -e "'VERSION='+require('./apps/electron/package.json').version" >> "$GITHUB_OUTPUT"
      - name: Build & Package Linux
        run: pnpm --filter @flow/electron build
      - name: Upload Release Artifact - Linux
        uses: softprops/action-gh-release@v3
        #if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION: ${{ steps.get-version.outputs.VERSION }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            release/flowoss-app-v${{ env.APP_VERSION }}-linux-x64.tar.gz
